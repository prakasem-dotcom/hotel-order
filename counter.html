<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0f0e0c;--surface:#1a1815;--card:#221f1b;--border:#2e2a25;--accent:#e8a838;--accent2:#f0c870;--text:#f0ebe3;--muted:#8a8070;--green:#5cba8a;--red:#e86060;--input-bg:#2a2520;--orange:#f07030;--blue:#4a9eff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
.pin-screen h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--accent2);margin-bottom:6px;}
.pin-screen p{font-size:13px;color:var(--muted);margin-bottom:28px;}
.pin-dots{display:flex;gap:14px;margin-bottom:24px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:background 0.2s;}
.pin-dot.filled{background:var(--accent);}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;}
.pin-key{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:16px;font-size:20px;font-weight:600;cursor:pointer;text-align:center;color:var(--text);transition:background 0.15s;}
.pin-key:active{background:var(--input-bg);}
.pin-error{color:var(--red);font-size:13px;margin-top:14px;min-height:20px;}
header{background:linear-gradient(135deg,#1a1510,#221a0c);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:10px;}
.logo{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
header h1{font-family:'Playfair Display',serif;font-size:18px;color:var(--accent2);}
header p{font-size:11px;color:var(--muted);}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
.container{max-width:700px;margin:0 auto;padding:16px 14px 80px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card);border-radius:12px;padding:5px;}
.tab{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;transition:all 0.2s;}
.tab.active{background:var(--input-bg);color:var(--text);}
.badge{color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px;}
.order-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.order-card.pending{border-color:var(--orange);}
.order-card.confirmed{border-color:var(--blue);}
.order-card-header{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.order-num-badge{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.order-num-badge.pending{color:var(--orange);}
.order-num-badge.confirmed{color:var(--blue);}
.order-num-badge.ready{color:var(--green);}
.order-customer{flex:1;}
.order-customer-name{font-size:14px;font-weight:600;}
.order-customer-time{font-size:11px;color:var(--muted);margin-top:2px;}
.order-total-badge{font-size:15px;font-weight:700;color:var(--green);}
.chevron{color:var(--muted);font-size:12px;transition:transform 0.2s;margin-left:4px;}
.order-card.open .chevron{transform:rotate(90deg);}
.order-body{display:none;border-top:1px solid var(--border);padding:14px 16px;}
.order-card.open .order-body{display:block;}
.order-item-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(46,42,37,0.5);}
.order-item-row:last-child{border-bottom:none;}
.order-item-name{flex:1;font-size:13px;}
.order-item-qty{font-size:12px;color:var(--muted);background:var(--input-bg);padding:2px 8px;border-radius:6px;}
.order-item-price{font-size:13px;font-weight:600;color:var(--green);}
.item-ready-tick{font-size:16px;margin-left:4px;}
.remove-item-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 4px;}
.order-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn-confirm{flex:1;background:var(--green);color:#0a1a12;border:none;border-radius:10px;padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;min-width:120px;}
.btn-cancel{background:rgba(232,96,96,0.12);color:var(--red);border:1.5px solid rgba(232,96,96,0.3);border-radius:10px;padding:11px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-add-item{background:rgba(232,168,56,0.1);color:var(--accent);border:1.5px solid rgba(232,168,56,0.25);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.add-item-panel{background:var(--input-bg);border-radius:10px;padding:12px;margin-top:10px;display:none;}
.add-item-panel.open{display:block;}
.add-item-panel select{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;margin-bottom:8px;outline:none;}
.add-item-panel-row{display:flex;gap:8px;align-items:center;}
.qty-mini-controls{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.qty-mini-btn{background:none;border:none;color:var(--accent);font-size:18px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-mini-num{width:32px;text-align:center;font-size:14px;font-weight:600;}
.btn-do-add{background:var(--accent);color:#0f0e0c;border:none;border-radius:8px;padding:9px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;flex:1;}
.manual-order-btn{width:100%;background:rgba(74,158,255,0.12);color:var(--blue);border:1.5px solid rgba(74,158,255,0.25);border-radius:12px;padding:13px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:400;}
.modal-backdrop.open{display:block;}
.modal-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--border);border-radius:20px 20px 0 0;z-index:401;display:none;max-height:90vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);}
.modal-sheet.open{display:block;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 6px;}
.modal-title-row{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 14px;border-bottom:1px solid var(--border);}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--accent2);}
.modal-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:4px;}
.modal-body{padding:16px 18px 24px;}
.form-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:6px;margin-top:14px;}
.form-input{width:100%;background:var(--input-bg);border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;}
.form-input:focus{border-color:var(--accent);}

/* Manual order menu grid */
.manual-menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.manual-menu-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color 0.15s;-webkit-tap-highlight-color:transparent;}
.manual-menu-card:active,.manual-menu-card.selected{border-color:var(--accent);background:rgba(232,168,56,0.07);}
.manual-menu-card-name{font-size:12px;line-height:1.3;margin-bottom:4px;}
.manual-menu-card-price{font-size:12px;color:var(--green);font-weight:700;}
.manual-qty-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--input-bg);padding:10px 12px;border-radius:10px;}
.manual-qty-label{font-size:13px;color:var(--muted);flex:1;}
.manual-cart-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.manual-cart-item:last-child{border-bottom:none;}

.btn-place-manual{width:100%;background:var(--green);color:#0a1a12;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;z-index:100;}
.bottom-bar-label{font-size:11px;color:var(--muted);}
.bottom-bar-amount{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent2);font-weight:700;}
.toast{position:fixed;top:18px;right:14px;background:var(--green);color:#0a1a12;font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;z-index:1000;opacity:0;transform:translateY(-10px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="pin-screen" id="pinScreen">
  <h2>Bill Counter</h2><p>Enter PIN to access</p>
  <div class="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div></div>
  <div class="pin-keypad">
    <button class="pin-key" data-key="1">1</button><button class="pin-key" data-key="2">2</button><button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button><button class="pin-key" data-key="5">5</button><button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button><button class="pin-key" data-key="8">8</button><button class="pin-key" data-key="9">9</button>
    <div></div><button class="pin-key" data-key="0">0</button><button class="pin-key" data-key="back">&#9003;</button>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>
<header>
  <div class="header-left"><div class="logo">&#128176;</div><div><h1>Bill Counter</h1><p>Confirm orders &amp; forward to kitchen</p></div></div>
  <div class="live-dot" id="liveDot"></div>
</header>
<div class="container">
  <div class="tabs">
    <button class="tab active" data-tab="pending">Pending <span class="badge" id="pendingBadge" style="background:var(--orange)">0</span></button>
    <button class="tab" data-tab="confirmed">In Kitchen <span class="badge" id="confirmedBadge" style="background:var(--blue)">0</span></button>
    <button class="tab" data-tab="all">All Orders</button>
  </div>
  <button class="manual-order-btn" id="manualBtn">&#10010; New Walk-in Order</button>
  <div id="ordersList"></div>
</div>
<div class="bottom-bar">
  <div><div class="bottom-bar-label">Total Revenue</div></div>
  <div class="bottom-bar-amount" id="revenueDisplay">Rs.0</div>
</div>
<div class="modal-backdrop" id="manualBackdrop"></div>
<div class="modal-sheet" id="manualSheet">
  <div class="modal-handle"></div>
  <div class="modal-title-row">
    <span class="modal-title">&#10010; Walk-in Order</span>
    <button class="modal-close" id="manualClose">&#10005;</button>
  </div>
  <div class="modal-body">
    <label class="form-label">Customer Name</label>
    <input type="text" class="form-input" id="manualName" placeholder="Enter customer name...">
    <label class="form-label">Select Items</label>
    <div class="manual-menu-grid" id="manualMenuGrid"></div>
    <div class="manual-qty-row" id="manualQtyRow" style="display:none;">
      <span class="manual-qty-label" id="manualQtyLabel">Qty</span>
      <div class="qty-mini-controls">
        <button class="qty-mini-btn" id="manualQtyMinus">&#8722;</button>
        <span class="qty-mini-num" id="manualQtyNum">1</span>
        <button class="qty-mini-btn" id="manualQtyPlus">+</button>
      </div>
      <button class="btn-do-add" id="manualAddItemBtn">Add</button>
    </div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;">Order Summary</div>
    <div id="manualItemsList"></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
      <span style="color:var(--muted);font-size:13px;">Order Total</span>
      <span style="font-weight:700;color:var(--green);font-size:16px;" id="manualTotal">Rs.0</span>
    </div>
    <button class="btn-place-manual" id="placeManualBtn">&#10003; Confirm &amp; Send to Kitchen</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var MENU=[
  {name:"Ghee Dosa",code:"gd",price:80},
  {name:"Podi Dosa",code:"pd",price:100},
  {name:"Masala Dosa",code:"md",price:120},
  {name:"Ragi Dosa",code:"rd",price:110},
  {name:"Cheese Dosa",code:"chd",price:100},
  {name:"Set Dosa",code:"sd",price:120},
  {name:"Onion Dosa",code:"od",price:100},
  {name:"Ragi Masala Dosa",code:"rmd",price:120},
  {name:"Kal Dosa With Chicken Curry",code:"kdcc",price:150},
  {name:"300 Kcal Dosa",code:"kkd",price:120},
  {name:"Idly",code:"idy",price:70},
  {name:"Mini Podi Idly",code:"mp",price:100},
  {name:"Sambar Idly Dip",code:"sid",price:80},
  {name:"Idly with Chicken Gravy",code:"icg",price:120},
  {name:"Ghee Millet Pongal",code:"gmp",price:110},
  {name:"Masala Tea",code:"mt",price:25},
  {name:"Chicken 65",code:"c65",price:120},
  {name:"Egg Bites",code:"eb",price:80},
  {name:"Veg Bites",code:"vb",price:70},
  {name:"Veg Comba",code:"vc",price:200}
];
function calcItemPrice(item,qty){
  if(item.code==='idy'){return qty<=2?qty*35:70+(qty-2)*30;}
  if(item.code==='sid'){if(qty===1)return 40;if(qty===2)return 80;return 100+(qty-3)*33;}
  return item.price*qty;
}

firebase.initializeApp({
  apiKey:"AIzaSyAk-H09EvvwzVweDzNxlh9QWKkzS_Kid9A",
  authDomain:"order-app-cf538.firebaseapp.com",
  databaseURL:"https://order-app-cf538-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"order-app-cf538",
  storageBucket:"order-app-cf538.firebasestorage.app",
  messagingSenderId:"506383247047",
  appId:"1:506383247047:web:d96eb4504231e2d06040e2"
});
var db=firebase.database();
db.ref('.info/connected').on('value',function(snap){
  var dot=document.getElementById('liveDot');
  dot.style.background=snap.val()?'var(--green)':'var(--red)';
});

var CORRECT_PIN='111';
var pinVal='',allOrders={},currentTab='pending',orderCounter=0;
var manualCart={},selectedManualCode=null,manualQtyVal=1;

function updatePinDots(){for(var i=0;i<3;i++)document.getElementById('d'+i).className='pin-dot'+(i<pinVal.length?' filled':'');}
function checkPin(){
  if(pinVal===CORRECT_PIN){document.getElementById('pinScreen').style.display='none';startListening();buildManualMenuGrid();}
  else{document.getElementById('pinError').textContent='Wrong PIN. Try again.';setTimeout(function(){pinVal='';updatePinDots();document.getElementById('pinError').textContent='';},900);}
}
document.querySelectorAll('.pin-key').forEach(function(btn){
  btn.addEventListener('click',function(){
    var k=btn.getAttribute('data-key');
    if(k==='back'){pinVal=pinVal.slice(0,-1);updatePinDots();}
    else{if(pinVal.length>=3)return;pinVal+=k;updatePinDots();if(pinVal.length===3)checkPin();}
  });
});

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    currentTab=tab.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    tab.classList.add('active');
    renderOrders();
  });
});

function startListening(){
  db.ref('orders').on('value',function(snap){
    allOrders=snap.val()||{};
    orderCounter=0;
    Object.values(allOrders).forEach(function(o){if(o.orderNumber&&o.orderNumber>orderCounter)orderCounter=o.orderNumber;});
    renderOrders();updateBadges();updateRevenue();
  });
}

function renderOrders(){
  var el=document.getElementById('ordersList');
  var entries=Object.entries(allOrders).sort(function(a,b){return (b[1].placedAt||0)-(a[1].placedAt||0);});
  if(currentTab==='pending')entries=entries.filter(function(e){return e[1].status==='pending';});
  else if(currentTab==='confirmed')entries=entries.filter(function(e){return e[1].status==='confirmed';});
  if(!entries.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">'+(currentTab==='pending'?'&#128336;':'&#128203;')+'</div><div>No orders here</div></div>';return;}
  el.innerHTML=entries.map(function(e){return buildOrderCard(e[0],e[1]);}).join('');
  el.querySelectorAll('.order-card-header').forEach(function(hdr){hdr.addEventListener('click',function(){hdr.parentElement.classList.toggle('open');});});
  el.querySelectorAll('.btn-confirm').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();confirmOrder(btn.getAttribute('data-key'));});});
  el.querySelectorAll('.btn-cancel').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();cancelOrder(btn.getAttribute('data-key'));});});
  el.querySelectorAll('.btn-add-item').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();document.getElementById('aip-'+btn.getAttribute('data-key')).classList.toggle('open');});});
  el.querySelectorAll('.btn-do-add').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();doAddItem(btn.getAttribute('data-key'));});});
  el.querySelectorAll('[data-qkey]').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var k=btn.getAttribute('data-qkey'),d=parseInt(btn.getAttribute('data-d')),el2=document.getElementById('aiq-'+k);if(el2)el2.textContent=Math.max(1,parseInt(el2.textContent)+d);});});
  el.querySelectorAll('.remove-item-btn').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();removeItem(btn.getAttribute('data-key'),parseInt(btn.getAttribute('data-i')));});});
}

function buildOrderCard(key,o){
  var statusColor=o.status==='pending'?'var(--orange)':o.status==='confirmed'?'var(--blue)':'var(--green)';
  var statusLabel=o.status==='pending'?'Pending Payment':o.status==='confirmed'?'In Kitchen':o.status==='ready'?'Ready':'Cancelled';
  var time=o.placedAt?new Date(o.placedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
  var orderNum=o.orderNumber?'#'+o.orderNumber:'NEW';
  var readyItems=o.readyItems||{};
  var itemRows=(o.items||[]).map(function(item,i){
    var isReady=readyItems[i]===true;
    return '<div class="order-item-row">'+
      '<span class="order-item-name">'+item.name+'</span>'+
      '<span class="order-item-qty">x'+item.qty+'</span>'+
      '<span class="order-item-price">Rs.'+item.total+'</span>'+
      (isReady?'<span class="item-ready-tick">&#9989;</span>':'')+
      (o.status==='pending'?'<button class="remove-item-btn" data-key="'+key+'" data-i="'+i+'">&#10005;</button>':'')+
    '</div>';
  }).join('');
  var menuOpts=MENU.map(function(m){return '<option value="'+m.code+'">'+m.name+' - Rs.'+m.price+'</option>';}).join('');
  var actions=o.status==='pending'?
    '<div class="order-actions">'+
    '<button class="btn-add-item" data-key="'+key+'">+ Add Item</button>'+
    '<button class="btn-cancel" data-key="'+key+'">Cancel</button>'+
    '<button class="btn-confirm" data-key="'+key+'">&#10003; Paid - Send to Kitchen</button>'+
    '</div>'+
    '<div class="add-item-panel" id="aip-'+key+'">'+
    '<select id="ais-'+key+'" style="width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-size:13px;margin-bottom:8px;outline:none;"><option value="">Select item...</option>'+menuOpts+'</select>'+
    '<div class="add-item-panel-row"><div class="qty-mini-controls"><button class="qty-mini-btn" data-qkey="'+key+'" data-d="-1">-</button><span class="qty-mini-num" id="aiq-'+key+'">1</span><button class="qty-mini-btn" data-qkey="'+key+'" data-d="1">+</button></div><button class="btn-do-add" data-key="'+key+'">Add</button></div></div>'
    :'';
  return '<div class="order-card '+o.status+'" id="oc-'+key+'">'+
    '<div class="order-card-header">'+
    '<span class="order-num-badge '+o.status+'">'+orderNum+'</span>'+
    '<div class="order-customer"><div class="order-customer-name">'+(o.customerName||'Walk-in')+'</div>'+
    '<div class="order-customer-time">'+time+' &nbsp;<span style="color:'+statusColor+'">'+statusLabel+'</span></div></div>'+
    '<span class="order-total-badge">Rs.'+o.total+'</span>'+
    '<span class="chevron">&#9658;</span></div>'+
    '<div class="order-body"><div>'+itemRows+'</div>'+actions+'</div></div>';
}

function confirmOrder(key){orderCounter++;db.ref('orders/'+key).update({status:'confirmed',orderNumber:orderCounter,confirmedAt:Date.now()});showToast('Order #'+orderCounter+' sent to kitchen!');}
function cancelOrder(key){db.ref('orders/'+key).update({status:'cancelled'});showToast('Order cancelled');}
function removeItem(key,idx){
  var order=allOrders[key];var items=order.items.slice();items.splice(idx,1);
  if(!items.length){showToast('Need at least 1 item');return;}
  db.ref('orders/'+key).update({items:items,total:items.reduce(function(s,i){return s+i.total;},0)});
}
function doAddItem(key){
  var sel=document.getElementById('ais-'+key);if(!sel||!sel.value)return;
  var m=MENU.find(function(i){return i.code===sel.value;});if(!m)return;
  var qEl=document.getElementById('aiq-'+key);var q=qEl?parseInt(qEl.textContent):1;
  var order=allOrders[key];var items=(order.items||[]).slice();
  var ex=items.find(function(i){return i.code===m.code;});
  if(ex){ex.qty+=q;ex.total=calcItemPrice(m,ex.qty);}
  else items.push({name:m.name,code:m.code,qty:q,price:m.price,total:calcItemPrice(m,q)});
  db.ref('orders/'+key).update({items:items,total:items.reduce(function(s,i){return s+i.total;},0)});
}
function updateBadges(){
  document.getElementById('pendingBadge').textContent=Object.values(allOrders).filter(function(o){return o.status==='pending';}).length;
  document.getElementById('confirmedBadge').textContent=Object.values(allOrders).filter(function(o){return o.status==='confirmed';}).length;
}
function updateRevenue(){
  document.getElementById('revenueDisplay').textContent='Rs.'+Object.values(allOrders).filter(function(o){return o.status==='confirmed'||o.status==='ready';}).reduce(function(s,o){return s+(o.total||0);},0);
}

/* ── MANUAL ORDER with menu grid ── */
function buildManualMenuGrid(){
  var grid=document.getElementById('manualMenuGrid');
  grid.innerHTML=MENU.map(function(item){
    return '<div class="manual-menu-card" data-code="'+item.code+'">'+
      '<div class="manual-menu-card-name">'+item.name+'</div>'+
      '<div class="manual-menu-card-price">Rs.'+item.price+'</div>'+
    '</div>';
  }).join('');
  grid.querySelectorAll('.manual-menu-card').forEach(function(card){
    card.addEventListener('click',function(){
      grid.querySelectorAll('.manual-menu-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      selectedManualCode=card.getAttribute('data-code');
      var item=MENU.find(function(m){return m.code===selectedManualCode;});
      document.getElementById('manualQtyLabel').textContent=item.name;
      document.getElementById('manualQtyNum').textContent=1;
      manualQtyVal=1;
      document.getElementById('manualQtyRow').style.display='flex';
    });
  });
}
document.getElementById('manualQtyMinus').addEventListener('click',function(){manualQtyVal=Math.max(1,manualQtyVal-1);document.getElementById('manualQtyNum').textContent=manualQtyVal;});
document.getElementById('manualQtyPlus').addEventListener('click',function(){manualQtyVal++;document.getElementById('manualQtyNum').textContent=manualQtyVal;});
document.getElementById('manualAddItemBtn').addEventListener('click',function(){
  if(!selectedManualCode)return;
  var m=MENU.find(function(i){return i.code===selectedManualCode;});if(!m)return;
  if(manualCart[m.code])manualCart[m.code]+=manualQtyVal;
  else manualCart[m.code]=manualQtyVal;
  manualQtyVal=1;document.getElementById('manualQtyNum').textContent=1;
  selectedManualCode=null;
  document.getElementById('manualQtyRow').style.display='none';
  document.getElementById('manualMenuGrid').querySelectorAll('.manual-menu-card').forEach(function(c){c.classList.remove('selected');});
  renderManualCart();
});
function renderManualCart(){
  var el=document.getElementById('manualItemsList');
  var codes=Object.keys(manualCart);
  el.innerHTML=codes.map(function(c){
    var item=MENU.find(function(m){return m.code===c;});if(!item)return'';
    var total=calcItemPrice(item,manualCart[c]);
    return '<div class="manual-cart-item">'+
      '<span style="flex:1">'+item.name+'</span>'+
      '<span style="color:var(--muted)">x'+manualCart[c]+'</span>'+
      '<span style="color:var(--green);font-weight:600;margin:0 8px">Rs.'+total+'</span>'+
      '<button data-c="'+c+'" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px" class="mc-remove">&#10005;</button>'+
    '</div>';
  }).join('');
  el.querySelectorAll('.mc-remove').forEach(function(btn){btn.addEventListener('click',function(){delete manualCart[btn.getAttribute('data-c')];renderManualCart();});});
  var total=codes.reduce(function(s,c){var item=MENU.find(function(m){return m.code===c;});return s+(item?calcItemPrice(item,manualCart[c]):0);},0);
  document.getElementById('manualTotal').textContent='Rs.'+total;
}
document.getElementById('placeManualBtn').addEventListener('click',function(){
  var name=document.getElementById('manualName').value.trim()||'Walk-in';
  var codes=Object.keys(manualCart);
  if(!codes.length){showToast('Add at least one item');return;}
  orderCounter++;
  var items=codes.map(function(c){var item=MENU.find(function(m){return m.code===c;});return{name:item.name,code:item.code,qty:manualCart[c],price:item.price,total:calcItemPrice(item,manualCart[c])};});
  var total=items.reduce(function(s,i){return s+i.total;},0);
  db.ref('orders').push({customerName:name,items:items,total:total,status:'confirmed',orderNumber:++orderCounter-1,placedAt:Date.now(),confirmedAt:Date.now(),readyAt:null,source:'counter'});
  manualCart={};renderManualCart();
  document.getElementById('manualName').value='';
  document.getElementById('manualQtyRow').style.display='none';
  selectedManualCode=null;
  closeManual();showToast('Walk-in order sent to kitchen!');
});
document.getElementById('manualBtn').addEventListener('click',function(){document.getElementById('manualBackdrop').classList.add('open');document.getElementById('manualSheet').classList.add('open');});
function closeManual(){document.getElementById('manualBackdrop').classList.remove('open');document.getElementById('manualSheet').classList.remove('open');}
document.getElementById('manualClose').addEventListener('click',closeManual);
document.getElementById('manualBackdrop').addEventListener('click',closeManual);
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
</script>
</body>

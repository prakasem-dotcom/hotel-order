<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Order Food</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0f0e0c;--surface:#1a1815;--card:#221f1b;--border:#2e2a25;
  --accent:#e8a838;--accent2:#f0c870;--text:#f0ebe3;--muted:#8a8070;
  --green:#5cba8a;--red:#e86060;--input-bg:#2a2520;--orange:#f07030;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:100px;}

/* HEADER */
header{background:linear-gradient(135deg,#1a1510,#221a0c);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;}
.logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
header h1{font-family:'Playfair Display',serif;font-size:19px;color:var(--accent2);}
header p{font-size:11px;color:var(--muted);margin-top:1px;}

.container{max-width:480px;margin:0 auto;padding:16px 12px;}

/* NAME */
.name-section{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.name-section label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:7px;}
.name-input{width:100%;background:var(--input-bg);border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
.name-input:focus{border-color:var(--accent);}
.name-input::placeholder{color:var(--muted);}

/* search removed */

/* SECTION TITLE */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* MENU GRID */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}

.menu-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:14px;
  overflow:hidden;transition:border-color 0.2s;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.menu-card.in-cart{border-color:var(--accent);}

/* Emoji food image area */
.menu-card-img{
  height:80px;display:flex;align-items:center;justify-content:center;
  font-size:38px;background:var(--input-bg);position:relative;
}
.menu-card-badge{
  position:absolute;top:6px;right:6px;
  background:var(--accent);color:#0f0e0c;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;
  display:none;
}
.menu-card.in-cart .menu-card-badge{display:block;}

.menu-card-body{padding:10px 11px 11px;flex:1;display:flex;flex-direction:column;gap:4px;}
.menu-card-name{font-size:12px;line-height:1.35;color:var(--text);flex:1;font-weight:500;}
.menu-card-price{font-size:13px;font-weight:700;color:var(--green);}
.menu-card-price-note{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3;}

/* INLINE QTY CONTROLS on each tile */
.menu-card-footer{padding:0 10px 10px;display:flex;align-items:center;justify-content:space-between;}

/* When qty=0 show just an ADD button */
.add-tile-btn{
  width:100%;background:rgba(232,168,56,0.1);color:var(--accent);
  border:1.5px solid rgba(232,168,56,0.25);border-radius:9px;
  padding:7px 0;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;text-align:center;transition:background 0.15s;
}
.add-tile-btn:active{background:rgba(232,168,56,0.22);}

/* When qty>0 show −  N  + */
.tile-qty-row{display:none;width:100%;align-items:center;justify-content:space-between;}
.menu-card.in-cart .add-tile-btn{display:none;}
.menu-card.in-cart .tile-qty-row{display:flex;}

.tile-qty-btn{
  width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  font-weight:300;transition:background 0.15s;
}
.tile-qty-btn.minus{background:rgba(232,96,96,0.15);color:var(--red);}
.tile-qty-btn.plus{background:rgba(92,186,138,0.15);color:var(--green);}
.tile-qty-btn:active{opacity:0.7;}
.tile-qty-num{font-size:16px;font-weight:700;color:var(--text);min-width:24px;text-align:center;}

/* CART SUMMARY (collapsible bottom bar) */
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:var(--surface);border-top:1.5px solid var(--border);
  transform:translateY(100%);transition:transform 0.3s cubic-bezier(.32,.72,0,1);
}
.cart-bar.visible{transform:translateY(0);}

.cart-bar-summary{
  display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;
}
.cart-bar-icon{font-size:20px;}
.cart-bar-info{flex:1;}
.cart-bar-count{font-size:12px;color:var(--muted);}
.cart-bar-total{font-family:'Playfair Display',serif;font-size:20px;color:var(--accent2);font-weight:700;}
.cart-bar-place-btn{
  background:var(--green);color:#0a1a12;border:none;border-radius:11px;
  padding:11px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;white-space:nowrap;
}
.cart-bar-place-btn:active{opacity:0.85;}

/* CART EXPAND PANEL */
.cart-panel{
  display:none;border-top:1px solid var(--border);
  max-height:45vh;overflow-y:auto;padding:10px 14px 14px;
}
.cart-bar.expanded .cart-panel{display:block;}
.cart-bar.expanded .cart-expand-arrow{transform:rotate(180deg);}
.cart-expand-arrow{font-size:12px;color:var(--muted);transition:transform 0.2s;}

.cart-item{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:10px;}
.cart-item:last-child{border-bottom:none;}
.cart-item-name{flex:1;font-size:13px;}
.cart-item-qty{font-size:12px;color:var(--muted);background:var(--input-bg);padding:2px 7px;border-radius:6px;}
.cart-item-price{font-weight:600;font-size:13px;color:var(--green);}
.cart-item-remove{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 4px;}

/* suggestions removed */

/* STATUS SCREEN */
.status-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;}
.status-screen.visible{display:flex;}
.status-icon{font-size:56px;margin-bottom:20px;}
.order-number{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;margin-bottom:8px;transition:color 0.8s ease;}
.order-number.pending{color:var(--orange);}
.order-number.confirmed{color:#4a9eff;}
.order-number.ready{color:var(--green);}
.order-number.cancelled{color:var(--muted);}
.order-status-label{font-size:15px;color:var(--muted);margin-bottom:6px;}
.order-status-msg{font-size:17px;font-weight:600;color:var(--text);margin-bottom:24px;line-height:1.4;}
.order-items-summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;width:100%;max-width:320px;text-align:left;margin-bottom:24px;}
.order-items-summary h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;}
.order-item-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
.order-item-row:last-child{border-bottom:none;}
.status-pulse{width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:6px;animation:blink 1.5s infinite;}
.status-pulse.confirmed{background:#4a9eff;}
.status-pulse.ready,.status-pulse.cancelled{animation:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.new-order-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 28px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:none;}
.new-order-btn.visible{display:inline-block;}

.toast{position:fixed;top:18px;right:14px;background:var(--green);color:#0a1a12;font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px;z-index:1000;opacity:0;transform:translateY(-10px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<header>
  <div class="logo">&#127869;</div>
  <div><h1>Order Food</h1><p>Pick items and place your order</p></div>
</header>

<div class="container">
  <!-- NAME (optional) -->
  <div class="name-section">
    <label>Your Name <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input type="text" class="name-input" id="customerName" placeholder="Enter your name..." autocomplete="off">
  </div>

  <!-- MENU -->
  <div class="section-title">Menu</div>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<!-- CART BAR (fixed bottom) -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-summary" id="cartBarSummary">
    <span class="cart-bar-icon">&#128722;</span>
    <div class="cart-bar-info">
      <div class="cart-bar-count" id="cartBarCount">0 items</div>
      <div class="cart-bar-total" id="cartBarTotal">Rs.0</div>
    </div>
    <span class="cart-expand-arrow" id="cartExpandArrow">&#9650;</span>
    <button class="cart-bar-place-btn" id="placeBtn">Place Order</button>
  </div>
  <div class="cart-panel" id="cartPanel"></div>
</div>

<!-- STATUS SCREEN -->
<div class="status-screen" id="statusScreen">
  <div class="status-icon" id="statusIcon">&#129534;</div>
  <div style="margin-bottom:6px;font-size:13px;color:var(--muted);">Order Number</div>
  <div class="order-number pending" id="orderNumberDisplay">#-</div>
  <div class="order-status-label"><span class="status-pulse" id="statusPulse"></span><span id="statusLabel">Waiting for confirmation...</span></div>
  <div class="order-status-msg" id="statusMsg">Your order is at the bill counter</div>
  <div class="order-items-summary">
    <h4>Items Ordered</h4>
    <div id="orderItemsList"></div>
  </div>
  <button class="new-order-btn" id="newOrderBtn">Place Another Order</button>
</div>

<div class="toast" id="toast"></div>

<script>
// Menu items with emoji icons
// tiered: array of {upTo, price} — price per piece up to that qty
var MENU = [
  {name:"Ghee Dosa",            code:"gd",   price:80,  emoji:"&#129380;"},
  {name:"Podi Dosa",            code:"pd",   price:100, emoji:"&#127859;"},
  {name:"Masala Dosa",          code:"md",   price:120, emoji:"&#129366;"},
  {name:"Veg Pizza Dosa",       code:"vpd",  price:150, emoji:"&#127829;"},
  {name:"Ragi Dosa",            code:"rd",   price:110, emoji:"&#127807;"},
  {name:"Cheese Dosa",          code:"chd",  price:100, emoji:"&#129472;"},
  {name:"Set Dosa",             code:"sd",   price:120, emoji:"&#129371;"},
  {name:"Onion Dosa",           code:"od",   price:100, emoji:"&#129381;"},
  {name:"Ragi Masala Dosa",     code:"rmd",  price:120, emoji:"&#127807;"},
  {name:"Kal Dosa With Chicken Curry", code:"kdcc", price:150, emoji:"&#127859;"},
  {name:"300 Kcal Dosa",        code:"kkd",  price:120, emoji:"&#128170;"},
  {name:"Idly",                 code:"idy",  price:70,  emoji:"&#129474;",
    tiered:[{upTo:1,unitPrice:35},{upTo:2,unitPrice:35},{upTo:99,unitPrice:30}],
    priceNote:"2 pcs Rs.70 | 3+ pcs Rs.30 each"},
  {name:"Mini Podi Idly",       code:"mp",   price:100, emoji:"&#129474;"},
  {name:"Sambar Idly Dip",      code:"sid",  price:80,  emoji:"&#127858;",
    tiered:[{upTo:1,unitPrice:40},{upTo:2,unitPrice:40},{upTo:99,unitPrice:33}],
    priceNote:"2 pcs Rs.80 | 3+ pcs Rs.33 each"},
  {name:"Idly with Chicken Gravy", code:"icg", price:120, emoji:"&#127859;"},
  {name:"Ghee Millet Pongal",   code:"gmp",  price:110, emoji:"&#127860;"},
  {name:"Masala Tea",           code:"mt",   price:25,  emoji:"&#9749;"},
  {name:"Chicken 65",           code:"c65",  price:120, emoji:"&#127371;", priceNote:"~6 pieces"},
  {name:"Egg Bites",            code:"eb",   price:80,  emoji:"&#129360;", priceNote:"5 pieces"},
  {name:"Veg Bites",            code:"vb",   price:70,  emoji:"&#129382;", priceNote:"5 pieces"},
  {name:"Veg Comba",            code:"vc",   price:200, emoji:"&#127793;"}
];

firebase.initializeApp({
  apiKey:"AIzaSyAk-H09EvvwzVweDzNxlh9QWKkzS_Kid9A",
  authDomain:"order-app-cf538.firebaseapp.com",
  databaseURL:"https://order-app-cf538-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"order-app-cf538",
  storageBucket:"order-app-cf538.firebasestorage.app",
  messagingSenderId:"506383247047",
  appId:"1:506383247047:web:d96eb4504231e2d06040e2"
});
var db = firebase.database();

// cart: { code -> qty }
var cart = {};
var currentOrderKey = null;

/* ── TIERED PRICE ── */
function calcPrice(item, qty) {
  if (!item.tiered) return item.price * qty;
  var total = 0;
  for (var i = 1; i <= qty; i++) {
    for (var t = 0; t < item.tiered.length; t++) {
      if (i <= item.tiered[t].upTo) { total += item.tiered[t].unitPrice; break; }
    }
  }
  return total;
}
function displayPrice(item, qty) {
  if (!item.tiered) return 'Rs.' + item.price;
  return 'Rs.' + calcPrice(item, qty);
}

/* ── MENU RENDER ── */
function renderMenu() {
  var grid = document.getElementById('menuGrid');
  grid.innerHTML = MENU.map(function(item) {
    var q = cart[item.code] || 0;
    var inCart = q > 0;
    var priceLabel = q > 0 ? 'Rs.' + calcPrice(item, q) : (item.tiered ? 'Rs.' + calcPrice(item,1) : 'Rs.' + item.price);
    var noteHTML = item.priceNote ? '<div class="menu-card-price-note">' + item.priceNote + '</div>' : '';
    return '<div class="menu-card' + (inCart ? ' in-cart' : '') + '" data-code="' + item.code + '">' +
      '<div class="menu-card-img">' +
        '<span>' + item.emoji + '</span>' +
        '<span class="menu-card-badge">x' + q + '</span>' +
      '</div>' +
      '<div class="menu-card-body">' +
        '<div class="menu-card-name">' + item.name + '</div>' +
        '<div class="menu-card-price" id="pr-' + item.code + '">' + priceLabel + '</div>' +
        noteHTML +
      '</div>' +
      '<div class="menu-card-footer">' +
        '<button class="add-tile-btn" data-code="' + item.code + '">+ Add</button>' +
        '<div class="tile-qty-row">' +
          '<button class="tile-qty-btn minus" data-code="' + item.code + '">&#8722;</button>' +
          '<span class="tile-qty-num">' + q + '</span>' +
          '<button class="tile-qty-btn plus" data-code="' + item.code + '">+</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('.add-tile-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) { e.stopPropagation(); changeQty(btn.getAttribute('data-code'), 1); });
  });
  grid.querySelectorAll('.tile-qty-btn.minus').forEach(function(btn) {
    btn.addEventListener('click', function(e) { e.stopPropagation(); changeQty(btn.getAttribute('data-code'), -1); });
  });
  grid.querySelectorAll('.tile-qty-btn.plus').forEach(function(btn) {
    btn.addEventListener('click', function(e) { e.stopPropagation(); changeQty(btn.getAttribute('data-code'), 1); });
  });
}
renderMenu();

function changeQty(code, delta) {
  var current = cart[code] || 0;
  var next = Math.max(0, current + delta);
  if (next === 0) delete cart[code];
  else cart[code] = next;
  renderMenu();
  updateCartBar();
}

/* ── CART BAR ── */
function getCartTotal() {
  return Object.keys(cart).reduce(function(s, c) {
    var item = MENU.find(function(m){ return m.code === c; });
    return s + (item ? calcPrice(item, cart[c]) : 0);
  }, 0);
}
function getCartQty() {
  return Object.keys(cart).reduce(function(s, c){ return s + cart[c]; }, 0);
}

function updateCartBar() {
  var bar = document.getElementById('cartBar');
  var totalQty = getCartQty();
  if (totalQty === 0) { bar.classList.remove('visible','expanded'); return; }
  bar.classList.add('visible');
  document.getElementById('cartBarCount').textContent = totalQty + ' item' + (totalQty > 1 ? 's' : '');
  document.getElementById('cartBarTotal').textContent = 'Rs.' + getCartTotal();
  renderCartPanel();
}

function renderCartPanel() {
  var panel = document.getElementById('cartPanel');
  panel.innerHTML = Object.keys(cart).map(function(c) {
    var item = MENU.find(function(m){ return m.code === c; });
    if (!item) return '';
    var total = calcPrice(item, cart[c]);
    return '<div class="cart-item">' +
      '<span style="font-size:17px;margin-right:4px">' + item.emoji + '</span>' +
      '<span class="cart-item-name">' + item.name + '</span>' +
      '<span class="cart-item-qty">x' + cart[c] + '</span>' +
      '<span class="cart-item-price">Rs.' + total + '</span>' +
      '<button class="cart-item-remove" data-code="' + c + '">&#10005;</button>' +
    '</div>';
  }).join('');
  panel.querySelectorAll('.cart-item-remove').forEach(function(btn) {
    btn.addEventListener('click', function() {
      delete cart[btn.getAttribute('data-code')];
      renderMenu(); updateCartBar();
    });
  });
}

document.getElementById('cartBarSummary').addEventListener('click', function(e) {
  if (e.target.closest('.cart-bar-place-btn')) return;
  document.getElementById('cartBar').classList.toggle('expanded');
});

/* ── PLACE ORDER ── */
document.getElementById('placeBtn').addEventListener('click', function() {
  var name = document.getElementById('customerName').value.trim() || 'Guest';
  var keys = Object.keys(cart);
  if (!keys.length) return;

  var items = keys.map(function(c) {
    var item = MENU.find(function(m){ return m.code === c; });
    var total = calcPrice(item, cart[c]);
    return {name:item.name, code:item.code, qty:cart[c], price:item.price, total:total};
  });
  var total = items.reduce(function(s, i){ return s + i.total; }, 0);

  var newRef = db.ref('orders').push();
  currentOrderKey = newRef.key;
  newRef.set({
    customerName: name,
    items: items,
    total: total,
    status: 'pending',
    placedAt: Date.now(),
    confirmedAt: null,
    readyAt: null
  });

  document.getElementById('statusScreen').classList.add('visible');
  document.getElementById('orderItemsList').innerHTML = items.map(function(i){
    return '<div class="order-item-row"><span>' + i.name + ' x' + i.qty + '</span><span>Rs.' + i.total + '</span></div>';
  }).join('');
  updateStatusUI('pending');

  cart = {}; renderMenu(); updateCartBar();
  document.getElementById('cartBar').classList.remove('expanded','visible');

  db.ref('orders/' + currentOrderKey).on('value', function(snap) {
    var d = snap.val(); if (!d) return;
    updateStatusUI(d.status);
    if (d.orderNumber) document.getElementById('orderNumberDisplay').textContent = '#' + d.orderNumber;
  });
});

function updateStatusUI(status) {
  var icons = {pending:'&#129534;', confirmed:'&#128104;&#8205;&#127859;', ready:'&#9989;', cancelled:'&#10060;'};
  var labels = {pending:'Waiting for confirmation...', confirmed:'Order confirmed!', ready:'Order Ready!', cancelled:'Order Cancelled'};
  var msgs = {pending:'Your order is at the bill counter', confirmed:'Payment done - being prepared in kitchen', ready:'Your food is ready - please collect it!', cancelled:'Your order was cancelled at the counter'};
  document.getElementById('orderNumberDisplay').className = 'order-number ' + status;
  document.getElementById('statusPulse').className = 'status-pulse ' + status;
  document.getElementById('statusIcon').innerHTML = icons[status] || '&#129534;';
  document.getElementById('statusLabel').textContent = labels[status] || '';
  document.getElementById('statusMsg').textContent = msgs[status] || '';
  var nb = document.getElementById('newOrderBtn');
  if (status === 'ready' || status === 'cancelled') nb.classList.add('visible');
  else nb.classList.remove('visible');
}

document.getElementById('newOrderBtn').addEventListener('click', function() {
  currentOrderKey = null;
  document.getElementById('statusScreen').classList.remove('visible');
  document.getElementById('orderNumberDisplay').textContent = '#-';
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
</script>
</body>
</html>

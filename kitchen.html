<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0f0e0c;--surface:#1a1815;--card:#221f1b;--border:#2e2a25;--accent:#e8a838;--accent2:#f0c870;--text:#f0ebe3;--muted:#8a8070;--green:#5cba8a;--red:#e86060;--input-bg:#2a2520;--blue:#4a9eff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:20px;}
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
.pin-screen h2{font-family:'Playfair Display',serif;font-size:24px;color:var(--accent2);margin-bottom:6px;}
.pin-screen p{font-size:13px;color:var(--muted);margin-bottom:28px;}
.pin-dots{display:flex;gap:14px;margin-bottom:24px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:background 0.2s;}
.pin-dot.filled{background:var(--accent);}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;}
.pin-key{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:16px;font-size:20px;font-weight:600;cursor:pointer;text-align:center;color:var(--text);}
.pin-key:active{background:var(--input-bg);}
.pin-error{color:var(--red);font-size:13px;margin-top:14px;min-height:20px;}
header{background:linear-gradient(135deg,#0d1a0f,#122010);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:10px;}
.logo{width:36px;height:36px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
header h1{font-family:'Playfair Display',serif;font-size:18px;color:var(--accent2);}
header p{font-size:11px;color:var(--muted);}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
.container{max-width:700px;margin:0 auto;padding:16px 14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.badge{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px;}

/* ORDER CARD */
.k-card{background:var(--card);border:2px solid var(--blue);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:opacity 0.3s;}
.k-card.done{border-color:var(--border);opacity:0.5;}
.k-card.in-progress{border-color:var(--accent);}
.k-card-header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;}
.k-order-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--blue);}
.k-card.in-progress .k-order-num{color:var(--accent);}
.k-card.done .k-order-num{color:var(--green);}
.k-customer-name{font-size:15px;font-weight:600;}
.k-order-time{font-size:11px;color:var(--muted);margin-top:2px;}
.k-total{font-size:16px;font-weight:700;color:var(--green);}

/* STATUS PILL */
.k-status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:0.5px;}
.k-status-pill.waiting{background:rgba(74,158,255,0.15);color:var(--blue);}
.k-status-pill.progress{background:rgba(232,168,56,0.15);color:var(--accent);}
.k-status-pill.done{background:rgba(92,186,138,0.15);color:var(--green);}

/* ITEMS */
.k-items{padding:0 16px 8px;}
.k-item-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;margin-bottom:6px;cursor:pointer;
  background:var(--input-bg);border:1.5px solid var(--border);
  transition:all 0.2s;user-select:none;-webkit-tap-highlight-color:transparent;
}
.k-item-row.ready{background:rgba(92,186,138,0.1);border-color:var(--green);}
.k-item-row:active{opacity:0.7;}
.k-item-name{flex:1;font-size:14px;line-height:1.3;}
.k-item-qty{background:rgba(74,158,255,0.15);color:var(--blue);font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;min-width:34px;text-align:center;}
.k-item-row.ready .k-item-qty{background:rgba(92,186,138,0.15);color:var(--green);}
.k-item-tick{font-size:18px;flex-shrink:0;}
.k-item-hint{font-size:10px;color:var(--muted);margin-top:4px;}

/* READY BUTTON */
.k-ready-btn{
  width:calc(100% - 32px);margin:4px 16px 16px;
  background:var(--green);color:#0a1a12;border:none;border-radius:12px;
  padding:13px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}
.done-label{padding:0 16px 14px;font-size:13px;color:var(--green);font-weight:600;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:50px;margin-bottom:14px;}
.toast{position:fixed;top:18px;right:14px;background:var(--green);color:#0a1a12;font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;z-index:1000;opacity:0;transform:translateY(-10px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="pin-screen" id="pinScreen">
  <h2>Kitchen</h2><p>Enter PIN to access</p>
  <div class="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div></div>
  <div class="pin-keypad">
    <button class="pin-key" data-key="1">1</button><button class="pin-key" data-key="2">2</button><button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button><button class="pin-key" data-key="5">5</button><button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button><button class="pin-key" data-key="8">8</button><button class="pin-key" data-key="9">9</button>
    <div></div><button class="pin-key" data-key="0">0</button><button class="pin-key" data-key="back">&#9003;</button>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>
<header>
  <div class="header-left"><div class="logo">&#128104;&#8205;&#127859;</div><div><h1>Kitchen</h1><p>Tap item when ready &bull; Tap Order Ready when all done</p></div></div>
  <div class="live-dot" id="liveDot"></div>
</header>
<div class="container">
  <div class="section-title">Active Orders <span class="badge" id="activeCount">0</span></div>
  <div id="kitchenOrders"></div>
</div>
<div class="toast" id="toast"></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAk-H09EvvwzVweDzNxlh9QWKkzS_Kid9A",
  authDomain:"order-app-cf538.firebaseapp.com",
  databaseURL:"https://order-app-cf538-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"order-app-cf538",
  storageBucket:"order-app-cf538.firebasestorage.app",
  messagingSenderId:"506383247047",
  appId:"1:506383247047:web:d96eb4504231e2d06040e2"
});
var db=firebase.database();
db.ref('.info/connected').on('value',function(snap){
  document.getElementById('liveDot').style.background=snap.val()?'var(--green)':'var(--red)';
});

var CORRECT_PIN='222';
var pinVal='';

function updatePinDots(){for(var i=0;i<3;i++)document.getElementById('d'+i).className='pin-dot'+(i<pinVal.length?' filled':'');}
function checkPin(){
  if(pinVal===CORRECT_PIN){document.getElementById('pinScreen').style.display='none';startListening();}
  else{document.getElementById('pinError').textContent='Wrong PIN. Try again.';setTimeout(function(){pinVal='';updatePinDots();document.getElementById('pinError').textContent='';},900);}
}
document.querySelectorAll('.pin-key').forEach(function(btn){
  btn.addEventListener('click',function(){
    var k=btn.getAttribute('data-key');
    if(k==='back'){pinVal=pinVal.slice(0,-1);updatePinDots();}
    else{if(pinVal.length>=3)return;pinVal+=k;updatePinDots();if(pinVal.length===3)checkPin();}
  });
});

function startListening(){
  db.ref('orders').on('value',function(snap){
    var all=snap.val()||{};
    // Sort: active (confirmed, in-progress) first by confirmedAt ASC, then done (ready) by readyAt DESC
    var active=[], done=[];
    Object.entries(all).forEach(function(e){
      if(e[1].status==='confirmed')active.push(e);
      else if(e[1].status==='ready')done.push(e);
    });
    active.sort(function(a,b){return (a[1].confirmedAt||0)-(b[1].confirmedAt||0);});
    done.sort(function(a,b){return (b[1].readyAt||0)-(a[1].readyAt||0);});
    var entries=active.concat(done);

    document.getElementById('activeCount').textContent=active.length;
    var el=document.getElementById('kitchenOrders');
    if(!entries.length){
      el.innerHTML='<div class="empty-state"><div class="empty-icon">&#127859;</div><div>No orders yet</div></div>';
      return;
    }
    el.innerHTML=entries.map(function(e){return buildKitchenCard(e[0],e[1]);}).join('');

    // Wire item taps
    el.querySelectorAll('.k-item-row').forEach(function(row){
      row.addEventListener('click',function(){
        var key=row.getAttribute('data-key');
        var idx=parseInt(row.getAttribute('data-idx'));
        toggleItemReady(key,idx,all[key]);
      });
    });
    // Wire order ready buttons
    el.querySelectorAll('.k-ready-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        db.ref('orders/'+btn.getAttribute('data-key')).update({status:'ready',readyAt:Date.now()});
        showToast('Order #'+btn.getAttribute('data-num')+' marked ready!');
      });
    });
  });
}

function buildKitchenCard(key,o){
  var readyItems=o.readyItems||{};
  var items=o.items||[];
  var readyCount=Object.values(readyItems).filter(Boolean).length;
  var allItemsReady=items.length>0&&readyCount===items.length;
  var isDone=o.status==='ready';
  var inProgress=readyCount>0&&!allItemsReady;

  var cardClass='k-card'+(isDone?' done':inProgress?' in-progress':'');
  var pillClass=isDone?'done':inProgress?'progress':'waiting';
  var pillLabel=isDone?'All Ready':inProgress?'In Progress':'Waiting';

  var time=o.confirmedAt?new Date(o.confirmedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';

  var itemRows=items.map(function(item,i){
    var isReady=readyItems[i]===true;
    return '<div class="k-item-row'+(isReady?' ready':'')+'" data-key="'+key+'" data-idx="'+i+'">'+
      '<span class="k-item-name">'+item.name+'</span>'+
      '<span class="k-item-qty">x'+item.qty+'</span>'+
      '<span class="k-item-tick">'+(isReady?'&#9989;':'&#9898;')+'</span>'+
    '</div>';
  }).join('');

  var footer=isDone?
    '<div class="done-label">&#9989; All items ready &mdash; delivered</div>':
    (allItemsReady?
      '<button class="k-ready-btn" data-key="'+key+'" data-num="'+(o.orderNumber||'')+'">&#10003; Order Ready — Notify Customer</button>':
      '<div style="padding:8px 16px 14px;font-size:12px;color:var(--muted)">&#128161; Tap each item above when it\'s ready</div>');

  return '<div class="'+cardClass+'">'+
    '<div class="k-card-header">'+
    '<span class="k-order-num">#'+(o.orderNumber||'-')+'</span>'+
    '<div style="flex:1">'+
    '<div class="k-customer-name">'+(o.customerName||'Walk-in')+'</div>'+
    '<div class="k-order-time">'+time+(o.source==='counter'?' &bull; Walk-in':'')+'</div>'+
    '</div>'+
    '<span class="k-status-pill '+pillClass+'">'+pillLabel+'</span>'+
    '</div>'+
    '<div class="k-items">'+itemRows+'</div>'+
    footer+
    '</div>';
}

function toggleItemReady(key,idx,order){
  if(order.status==='ready')return; // order already done
  var readyItems=Object.assign({},order.readyItems||{});
  readyItems[idx]=!readyItems[idx]; // toggle
  var update={readyItems:readyItems};
  // Check if all items are now ready
  var items=order.items||[];
  var allReady=items.every(function(_,i){return readyItems[i]===true;});
  if(allReady){
    // auto-show ready button glow but don't auto-complete — kitchen still taps button
  }
  db.ref('orders/'+key).update(update);
  var itemName=(order.items[idx]||{}).name||'Item';
  showToast(readyItems[idx]?itemName+' ready!':itemName+' unmarked');
}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
</script>
</body>
</html>
